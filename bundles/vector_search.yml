# Databricks Job: builds/refreshes the KPI/glossary Vector Search index —
# see src/ml/vector_search/build_kpi_glossary_index.py for the
# transformation and ADR-0008/ADR-0012 for the design.
#
# Manual/low-frequency, like bundles/seed_reference_data_job.yml — glossary
# docs (docs/glossary/*.md) change far less often than Gold data, so this
# is triggered whenever those docs change (e.g. a CI step on a docs/
# change, added in Phase 8) rather than on a tight recurring schedule.

resources:
  jobs:
    build_kpi_glossary_index:
      name: "smartmeter-${bundle.target}-build-kpi-glossary-index"

      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - databricks-vectorsearch>=0.40,<1

      tasks:
        - task_key: build_index
          environment_key: default
          spark_python_task:
            python_file: ../src/ml/vector_search/build_kpi_glossary_index.py
            parameters: ["--catalog", "${var.catalog_name}"]

      email_notifications:
        on_failure:
          - REPLACE-WITH-ONCALL-DISTRIBUTION-LIST@yourcompany.com
