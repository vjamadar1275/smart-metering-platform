# Lakeflow Declarative Pipeline: Silver meter readings (validation,
# dedup, enrichment) + its quarantine table.
# See src/pipelines/silver/silver_meter_readings.py for the transformation,
# ADR-0003 for why Lakeflow, ADR-0010 for the quarantine/late-arrival design.

resources:
  pipelines:
    silver_meter_readings:
      name: "smartmeter-${bundle.target}-silver-meter-readings"
      catalog: ${var.catalog_name}
      target: silver
      serverless: true
      photon: true
      continuous: true
      channel: CURRENT

      libraries:
        - file:
            path: ../src/pipelines/silver/silver_meter_readings.py

      configuration:
        smartmeter.silver.watermark_hours: ${var.silver_watermark_hours}
        smartmeter.silver.max_clock_skew_hours: ${var.silver_max_clock_skew_hours}
        smartmeter.silver.max_plausible_liters: ${var.silver_max_plausible_liters}
        spark.sql.adaptive.enabled: "true"

      notifications:
        - alerts:
            - on-update-failure
            - on-flow-failure
          email_recipients:
            - REPLACE-WITH-ONCALL-DISTRIBUTION-LIST@yourcompany.com
