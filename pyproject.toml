[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["bundles", "terraform"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# `spark` and `dbutils` are Databricks-injected globals in Lakeflow pipeline
# / notebook execution contexts — not undefined, just not importable locally.
"src/pipelines/**" = ["F821"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
